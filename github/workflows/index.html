<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Image Upscaler</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f5f7;
  color:#1d1d1f;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif
}

.container{
  max-width:520px;
  margin:auto;
  padding:35px 20px
}

h1{
  text-align:center;
  font-size:30px;
  margin-bottom:8px
}

.subtitle{
  text-align:center;
  color:#6e6e73;
  margin-bottom:30px
}

.card{
  background:white;
  padding:25px;
  border-radius:22px;
  box-shadow:0 5px 25px rgba(0,0,0,.07)
}

.upload{
  display:block;
  width:100%;
  padding:16px;
  text-align:center;
  background:#007aff;
  color:white;
  border-radius:14px;
  font-weight:600
}

input{display:none}

.preview,#result{
  width:100%;
  margin-top:20px;
  border-radius:15px;
  display:none
}

.info{
  margin-top:15px;
  font-size:14px;
  color:#6e6e73;
  text-align:center
}

.settings{
  margin-top:20px;
  display:none
}

.settings-title{
  font-weight:600;
  margin-bottom:10px
}

.scale-buttons{
  display:flex;
  gap:10px
}

.scale{
  flex:1;
  padding:13px;
  border:1px solid #ddd;
  border-radius:12px;
  background:white;
  font-weight:600
}

.scale.selected{
  background:#007aff;
  color:white;
  border-color:#007aff
}

#upscale{
  width:100%;
  margin-top:20px;
  padding:16px;
  border:0;
  border-radius:14px;
  background:#1d1d1f;
  color:white;
  font-size:16px;
  font-weight:600;
  display:none
}

#upscale:disabled{
  opacity:.5
}

#message{
  text-align:center;
  margin-top:20px;
  color:#6e6e73;
  line-height:1.5
}

#download{
  display:none;
  margin-top:15px;
  padding:15px;
  text-align:center;
  text-decoration:none;
  background:#34c759;
  color:white;
  border-radius:14px;
  font-weight:600
}
</style>
</head>

<body>

<div class="container">

<h1>AI Image Upscaler</h1>

<div class="subtitle">
AIで画像を高解像度化
</div>

<div class="card">

<label class="upload" for="imageInput">
画像を選択
</label>

<input id="imageInput" type="file" accept="image/*">

<img id="preview" class="preview">

<div id="info" class="info">
画像を選択してください
</div>

<div id="settings" class="settings">

<div class="settings-title">
出力設定
</div>

<div class="scale-buttons">

<button type="button" class="scale selected" data-scale="2">
×2
</button>

<button type="button" class="scale" data-scale="4">
×4
</button>

</div>

</div>

<button type="button" id="upscale">
AIで高画質化する
</button>

<div id="message"></div>

<img id="result">

<a id="download" download="ai-upscaled.png">
高画質画像を保存
</a>

</div>

</div>

<script>

const input = document.getElementById("imageInput");
const preview = document.getElementById("preview");
const info = document.getElementById("info");
const settings = document.getElementById("settings");
const upscaleButton = document.getElementById("upscale");
const message = document.getElementById("message");
const result = document.getElementById("result");
const download = document.getElementById("download");

let selectedFile = null;
let selectedScale = 2;

input.addEventListener("change", function(){

  const file = this.files[0];

  if(!file) return;

  selectedFile = file;

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";

  info.textContent = file.name;

  settings.style.display = "block";
  upscaleButton.style.display = "block";

  result.style.display = "none";
  download.style.display = "none";
  message.textContent = "";

});

document.querySelectorAll(".scale").forEach(button => {

  button.addEventListener("click", function(){

    document.querySelectorAll(".scale")
      .forEach(b => b.classList.remove("selected"));

    this.classList.add("selected");

    selectedScale = Number(this.dataset.scale);

  });

});

upscaleButton.addEventListener("click", async function(){

  if(!selectedFile) return;

  upscaleButton.disabled = true;
  message.textContent = "画像をアップロードしています…";

  try{

    const base64 = await fileToBase64(selectedFile);

    const response = await fetch("/api/upscale",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        image:base64,
        scaleFactor:selectedScale
      })

    });

    const data = await response.json();

    if(!response.ok){
      throw new Error(
        data.error
          ? JSON.stringify(data.error)
          : "AI処理の開始に失敗しました"
      );
    }

    if(!data.project_id){
      throw new Error("プロジェクトIDを取得できませんでした");
    }

    message.textContent =
      "AIが画像を処理しています…";

    await waitForResult(data.project_id);

  }catch(error){

    console.error(error);

    message.textContent =
      "エラー: " + error.message;

    upscaleButton.disabled = false;

  }

});

async function waitForResult(projectId){

  const maxAttempts = 60;

  for(let i=0;i<maxAttempts;i++){

    await sleep(3000);

    const response = await fetch(
      "/api/upscale?project_id=" +
      encodeURIComponent(projectId)
    );

    const data = await response.json();

    if(!response.ok){
      throw new Error(
        data.error
          ? JSON.stringify(data.error)
          : "処理状況を取得できませんでした"
      );
    }

    if(data.status === "complete"){

      const outputUrl = data.output_url;

      if(!outputUrl){
        throw new Error("完成画像URLがありません");
      }

      result.src = outputUrl;
      result.style.display = "block";

      download.href = outputUrl;
      download.style.display = "block";

      message.textContent =
        "AI高画質化が完了しました！";

      upscaleButton.disabled = false;

      return;
    }

    if(
      data.status === "failed" ||
      data.status === "error"
    ){
      throw new Error("AI画像処理に失敗しました");
    }

    message.textContent =
      "AI処理中… " + Math.round((i+1)/maxAttempts*100) + "%";
  }

  throw new Error(
    "処理が長時間続いています。しばらくしてから確認してください。"
  );
}

function fileToBase64(file){

  return new Promise((resolve,reject)=>{

    const reader = new FileReader();

    reader.onload = () => resolve(reader.result);

    reader.onerror = reject;

    reader.readAsDataURL(file);

  });

}

function sleep(ms){

  return new Promise(resolve =>
    setTimeout(resolve,ms)
  );

}

</script>

</body>
</html>
