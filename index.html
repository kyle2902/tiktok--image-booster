<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>TikTok Image Booster</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
.wrap{max-width:560px;margin:auto;padding:28px 18px 40px}.card{background:white;border-radius:22px;padding:22px;box-shadow:0 8px 30px #0000000d;margin-bottom:14px}
h1{font-size:28px;margin:0 0 8px}.sub{color:#666;font-size:14px;line-height:1.5}.drop{border:2px dashed #bbb;border-radius:18px;padding:28px 14px;text-align:center;margin-top:18px}
button,.filelabel{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;cursor:pointer}
.primary{background:#111;color:#fff;margin-top:12px}.secondary{background:#eee;color:#111;margin-top:10px}
input[type=file]{display:none}.preview{width:100%;max-height:330px;object-fit:contain;border-radius:14px;margin-top:16px;background:#eee;display:none}
.row{display:flex;gap:10px;margin-top:14px}.choice{flex:1}.choice input{display:none}.choice label{display:block;text-align:center;padding:12px;border:1px solid #ddd;border-radius:12px;font-weight:600}.choice input:checked+label{border:2px solid #111}
.progress{height:8px;background:#eee;border-radius:10px;overflow:hidden;margin-top:14px;display:none}.bar{height:100%;width:0;background:#111;transition:.2s}
.small{font-size:12px;color:#777;margin-top:10px;line-height:1.5}.result{display:none}.download{background:#111;color:white;text-align:center;text-decoration:none;padding:15px;border-radius:14px;display:block;font-weight:700;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>✦ Image Booster</h1>
<div class="sub">Pinterest素材をTikTok向けに整える自分用MVP。まずは「高画質化＋9:16」をブラウザだけで試せます。</div>
<div class="drop">
<label class="filelabel" style="background:#111;color:white" for="file">写真を選択</label>
<input id="file" type="file" accept="image/*">
<img id="preview" class="preview">
</div>
</div>

<div class="card">
<b>出力設定</b>
<div class="row">
<div class="choice"><input checked type="radio" name="scale" id="s2" value="2"><label for="s2">2×</label></div>
<div class="choice"><input type="radio" name="scale" id="s4" value="4"><label for="s4">4×</label></div>
</div>
<button class="primary" id="process">TikTok用に処理</button>
<div class="progress" id="progress"><div class="bar" id="bar"></div></div>
<div class="small">MVP版は端末内で画像処理します。高品質AIモデル版は次の段階で追加します。</div>
</div>

<div class="card result" id="result">
<b>完成</b>
<img id="out" class="preview" style="display:block">
<a id="download" class="download">画像を保存</a>
<div class="small">iPhoneでは保存後、写真アプリからTikTokへ投稿できます。</div>
</div>
</div>

<script>
let img=null;
const file=document.getElementById('file'), preview=document.getElementById('preview');
file.onchange=()=>{
 const f=file.files[0]; if(!f)return;
 const r=new FileReader(); r.onload=e=>{preview.src=e.target.result;preview.style.display='block';img=new Image();img.onload=()=>{};img.src=e.target.result};r.readAsDataURL(f);
};
document.getElementById('process').onclick=()=>{
 if(!img){alert('まず写真を選択してください');return;}
 const scale=+document.querySelector('input[name=scale]:checked').value;
 const prog=document.getElementById('progress'),bar=document.getElementById('bar');
 prog.style.display='block'; bar.style.width='20%';
 setTimeout(()=>{
   const targetW=1080,targetH=1920;
   const srcRatio=img.width/img.height, targetRatio=targetW/targetH;
   let sw=img.width,sh=img.height,sx=0,sy=0;
   if(srcRatio>targetRatio){sw=Math.round(img.height*targetRatio);sx=Math.round((img.width-sw)/2)}
   else {sh=Math.round(img.width/targetRatio);sy=Math.round((img.height-sh)/2)}
   bar.style.width='55%';
   const c=document.createElement('canvas');c.width=targetW;c.height=targetH;
   const ctx=c.getContext('2d');
   ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
   ctx.drawImage(img,sx,sy,sw,sh,0,0,targetW,targetH);
   bar.style.width='90%';
   c.toBlob(blob=>{
      const url=URL.createObjectURL(blob);
      document.getElementById('out').src=url;
      const dl=document.getElementById('download');dl.href=url;dl.download='tiktok_1080x1920.jpg';
      document.getElementById('result').style.display='block';bar.style.width='100%';
      setTimeout(()=>prog.style.display='none',300);
   },'image/jpeg',0.94);
 },250);
};
</script>
</body>
</html>
